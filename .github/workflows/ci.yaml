name: SRE Project CI
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

################Python Validation and Tests##############
  python-test:
    name: Python Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python syntax check
        run: |
          python -m compileall .
        
      # - name: Run tests
      #   run: |
      #     pytest -v

###################Build and scan docker image#####################
  build-and-scan:
    name: Build and Scan Docker Image
    runs-on: ubuntu-latest
    needs:
      - python-test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clear Docker Cache
        run: docker buildx prune -af

      - name: Set up Docker Buildx 
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build --pull --no-cache -t task-api:${{github.sha}} .
          
      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: task-api:${{github.sha}}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

#####################Push Docker Image#####################
  docker-push:
    name: Push Docker Image
    runs-on: ubuntu-latest

    needs:
      - build-and-scan

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read application image tag
        id: image-version
        shell: bash
        run: |
          image_tag=$(awk '$1 == "tag:" { print $2; exit }' helm/sre-project/values.yaml)
          if [[ ! "$image_tag" =~ ^v[0-9]+$ ]]; then
            echo "Invalid application image tag: $image_tag"
            exit 1
          fi
          echo "tag=$image_tag" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            mohit2709/task-api:latest
            mohit2709/task-api:${{ github.sha }}
            mohit2709/task-api:${{ steps.image-version.outputs.tag }}
          



